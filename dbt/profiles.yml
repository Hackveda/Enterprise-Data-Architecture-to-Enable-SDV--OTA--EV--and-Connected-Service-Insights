automotive_edp:
  target: prod
  outputs:
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'EDP_ENGINEER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'ENTERPRISE_DATA') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'EDP_INGEST_WH') }}"
      schema: STAGING
      threads: 8
      client_session_keep_alive: false
